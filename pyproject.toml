[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tie-bench"
version = "0.1.0"
description = "Turning injections into evidence: a benchmark and defenses for prompt injections that target AI-assisted malware, package and email triage"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shahzaib" }]
keywords = ["prompt injection", "malware analysis", "LLM security", "supply chain", "benchmark"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
local = ["llama-cpp-python>=0.3", "r2pipe>=1.9"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
tie = "tie.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E741", "B008"]
